interface:
  display_name: "超星作业助手"
  short_description: "打开泛雅作业、写高质量答案并暂时保存"
  default_prompt: "Use $gmu-elearn-assignment-assistant to open https://i.chaoxing.com, follow the Chaoxing login flow when needed, locate 《课程名》里的未交作业, independently read the assignment and write a very high-quality Chinese answer yourself, fill the editor, click `暂时保存`, have a subagent explicitly using gpt-6-astra independently review the saved answer, improve and re-save if needed, confirm the revised version with that subagent, and stop before final submission."

policy:
  allow_implicit_invocation: true
